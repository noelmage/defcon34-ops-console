services:
  defcon34-ops:
    image: ghcr.io/noelmage/defcon34-ops-console:latest
    container_name: defcon34-ops
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_EMAIL: ${GOOGLE_ALLOWED_EMAIL:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://dc34.henry.house/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPS_REPO_URL: ${OPS_REPO_URL:-https://github.com/noelmage/DefCon34Badge.git}
      OPS_REPO_BRANCH: ${OPS_REPO_BRANCH:-main}
      OPS_REPO_PATH: /app/data/DefCon34Badge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.defcon34-ops.rule=Host(`dc34.henry.house`)"
      - "traefik.http.routers.defcon34-ops.entrypoints=websecure"
      - "traefik.http.routers.defcon34-ops.tls=true"
      - "traefik.http.routers.defcon34-ops.tls.certresolver=letsencrypt"
      - "traefik.http.services.defcon34-ops.loadbalancer.server.port=8000"
