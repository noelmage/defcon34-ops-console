services:
  defcon34-ops:
    image: defcon34-ops:latest
    build:
      context: .
    container_name: defcon34-ops
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      DEFCON_OPS_DB: /app/data/ops.db
      DEFCON_OPS_EVIDENCE_DIR: /app/data/evidence
      DEFCON_OPS_USER: ${DEFCON_OPS_USER:-admin}
      DEFCON_OPS_PASSWORD: ${DEFCON_OPS_PASSWORD:-change-me}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.defcon34-ops.rule=Host(`dc34.henry.house`)"
      - "traefik.http.routers.defcon34-ops.entrypoints=websecure"
      - "traefik.http.routers.defcon34-ops.tls=true"
      - "traefik.http.routers.defcon34-ops.tls.certresolver=letsencrypt"
      - "traefik.http.services.defcon34-ops.loadbalancer.server.port=8000"
