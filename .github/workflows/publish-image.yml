name: Publish container image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/noelmage/defcon34-ops-console:latest
            ghcr.io/noelmage/defcon34-ops-console:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/noelmage/defcon34-ops-console
